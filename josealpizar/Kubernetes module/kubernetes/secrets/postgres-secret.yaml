apiVersion: v1
kind: Secret
# Credenciales de PostgreSQL consumidas por la base de datos, la aplicacion y el CronJob.
# Identidad y namespace del Secret.
metadata:
  name: postgres-credentials
  namespace: test
# Tipo de Secret y valores de conexion de PostgreSQL.
type: Opaque
stringData:
  POSTGRES_DB: appdb
  POSTGRES_USER: appuser
  POSTGRES_PASSWORD: password