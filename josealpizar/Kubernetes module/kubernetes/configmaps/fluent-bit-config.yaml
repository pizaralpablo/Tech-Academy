apiVersion: v1
kind: ConfigMap
# Configuracion de Fluent Bit para recopilar logs de los contenedores y enviarlos a Loki.
# Identidad y namespace de la configuracion del agente.
metadata:
  name: fluent-bit-config
  namespace: test
# Archivos que definen la recoleccion, enriquecimiento y parseo de logs.
data:
  # Flujo principal de Fluent Bit: servicio, entrada, filtro y salidas.
  fluent-bit.conf: |
    [SERVICE]
        Flush        5
        Daemon       Off
        Log_Level    info
        Parsers_File parsers.conf

    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Parser            cri
        Tag               kube.*
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            Off

    [OUTPUT]
        Name   stdout
        Match  kube.*

    [OUTPUT]
        Name        loki
        Match       kube.*
        Host        loki
        Port        3100
        Labels      job=fluent-bit,namespace=$kubernetes['namespace_name'],pod=$kubernetes['pod_name'],container=$kubernetes['container_name']
        Line_Format json
  # Parser CRI usado para interpretar los logs de contenedores.
  parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<message>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
