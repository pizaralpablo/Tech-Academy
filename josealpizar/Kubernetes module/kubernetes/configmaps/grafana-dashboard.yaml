apiVersion: v1
kind: ConfigMap
# Dashboard y proveedor de carga automatica para Grafana.
# Identidad y namespace de los recursos de visualizacion.
metadata:
  name: grafana-dashboard
  namespace: test
# Archivos que Grafana carga para registrar el proveedor y el dashboard.
data:
  # Proveedor que busca dashboards en el directorio montado.
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: Kubernetes Lab
        orgId: 1
        folder: Kubernetes Lab
        type: file
        disableDeletion: true
        editable: true
        options:
          path: /var/lib/grafana/dashboards
  # Dashboard de logs del laboratorio para Grafana y Loki.
  kubernetes-lab.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "links": [],
      "panels": [
        {
          "datasource": {"type": "loki", "uid": "loki"},
          "gridPos": {"h": 12, "w": 24, "x": 0, "y": 0},
          "id": 1,
          "options": {"deduplication": true, "enableLogDetails": true, "prettifyLogMessage": false, "showCommonLabels": false, "showLabels": true, "showTime": true, "sortOrder": "Descending", "wrapLines": false},
          "targets": [{"expr": "{job=\"fluent-bit\"}", "refId": "A"}],
          "title": "Logs del namespace test",
          "type": "logs"
        },
        {
          "datasource": {"type": "loki", "uid": "loki"},
          "gridPos": {"h": 10, "w": 12, "x": 0, "y": 12},
          "id": 2,
          "options": {"deduplication": true, "enableLogDetails": true, "showLabels": true, "showTime": true, "sortOrder": "Descending"},
          "targets": [{"expr": "{job=\"fluent-bit\",namespace=\"test\",pod=~\"node-web-.*\"}", "refId": "A"}],
          "title": "Logs de Node Web",
          "type": "logs"
        },
        {
          "datasource": {"type": "loki", "uid": "loki"},
          "gridPos": {"h": 10, "w": 12, "x": 12, "y": 12},
          "id": 3,
          "options": {"deduplication": true, "enableLogDetails": true, "showLabels": true, "showTime": true, "sortOrder": "Descending"},
          "targets": [{"expr": "{job=\"fluent-bit\",namespace=\"test\",pod=~\"postgres-.*\"}", "refId": "A"}],
          "title": "Logs de PostgreSQL",
          "type": "logs"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": ["kubernetes", "loki", "fluent-bit"],
      "templating": {"list": []},
      "time": {"from": "now-24h", "to": "now"},
      "timepicker": {},
      "timezone": "browser",
      "title": "Kubernetes Lab - Logs",
      "uid": "kubernetes-lab-logs",
      "version": 2
    }
