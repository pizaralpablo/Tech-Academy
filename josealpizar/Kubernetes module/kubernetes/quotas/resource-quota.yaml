apiVersion: v1
kind: ResourceQuota
# Limites globales de Pods, Services, almacenamiento y recursos del namespace.
# Identidad y namespace al que se aplica la cuota.
metadata:
  name: test-quota
  namespace: test
spec:
  # Limites totales de objetos, CPU, memoria y almacenamiento del namespace.
  hard:
    pods: "10"
    services: "5"
    persistentvolumeclaims: "3"
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi