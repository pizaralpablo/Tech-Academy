# Usa la API base de Kubernetes para crear un Secret.
apiVersion: v1
kind: Secret # Guarda datos de conexion que consume PostgreSQL.
metadata:
# Identidad del Secret referenciado por StatefulSet y CronJob.
  name: tarea-postgres-credentials # Nombre esperado por los recursos de PostgreSQL del ejemplo.
  namespace: tarea # Los Secrets deben estar en el mismo namespace que sus Pods.
type: Opaque # Tipo generico para valores de configuracion y credenciales.
stringData:
  POSTGRES_DB: appdb # Nombre de la base de datos inicial.
  POSTGRES_USER: appuser # Usuario inicial de PostgreSQL.
  POSTGRES_PASSWORD: local-example-change-me # Cambia este valor; stringData se guarda codificado, no cifrado por si solo.