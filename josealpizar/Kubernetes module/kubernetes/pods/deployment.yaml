apiVersion: apps/v1
kind: Deployment
# Aplicacion web Node con dos replicas y conexion a PostgreSQL.
# Identidad y etiquetas usadas para localizar el Deployment.
metadata:
  name: node-web
  namespace: test
  labels:
    app: node-web
spec:
  # Replicas deseadas y selector que mantiene asociado el Pod.
  replicas: 2
  selector:
    matchLabels:
      app: node-web
  template:
    # Etiquetas que identifican cada Pod creado por el Deployment.
    metadata:
      labels:
        app: node-web
    spec:
      # Contenedor de la aplicacion y su configuracion de ejecucion.
      containers:
        - name: node-web
          image: k8s-lab-node:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          # Recursos reservados y maximos permitidos para la aplicacion.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          env:
            # Conexion a PostgreSQL, con credenciales obtenidas del Secret.
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
