apiVersion: apps/v1
kind: Deployment
# Servidor Loki con configuracion y almacenamiento temporal del laboratorio.
# Identidad y etiquetas usadas por el servicio de logs.
metadata:
  name: loki
  namespace: test
  labels:
    app: loki
spec:
  # Replica, selector y plantilla del Pod de Loki.
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    # Etiquetas y configuracion de ejecucion del Pod.
    metadata:
      labels:
        app: loki
    spec:
      # Contenedor Loki con su endpoint HTTP y comprobacion de disponibilidad.
      containers:
        - name: loki
          image: grafana/loki:3.2.1
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports:
            - name: http
              containerPort: 3100
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          # Archivos de configuracion y datos montados en el contenedor.
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
      volumes:
        # Configuracion procedente del ConfigMap y datos temporales del Pod.
        - name: config
          configMap:
            name: loki-config
        - name: data
          emptyDir: {}
