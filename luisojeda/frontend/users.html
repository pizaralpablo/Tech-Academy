<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luis O | Registered users</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell users-page">
      <nav class="navbar" aria-label="Account navigation">
        <a class="brand" href="/" aria-label="Return to home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none"><path d="M5 15.5h5v-5h5v5h5v-5h5v5h2.2c1.2 0 2.2-.9 2.2-2.1V11h-2.7v2h-2v-2h-5v2h-2v-2h-5v2h-2v-2H5v4.5Z" fill="currentColor" /><path d="M5 18.5h22c-1 4.8-4.9 7.5-10.5 7.5C10.2 26 6.2 23.4 5 18.5Z" fill="currentColor" opacity=".75" /></svg>
          </span>
          Luis O<span> / registered users</span>
        </a>
        <button class="account-trigger" id="logout-button" type="button">Sign out</button>
      </nav>

      <section class="users-content" aria-labelledby="users-heading">
        <p class="eyebrow"><span></span> Protected area</p>
        <h1 id="users-heading">Registered users.</h1>
        <p class="section-intro">This list is loaded from the protected API after a successful login.</p>
        <p class="form-message" id="users-message" role="status" aria-live="polite">Loading users…</p>
        <div class="users-table-wrap">
          <table class="users-table">
            <thead><tr><th>Username</th><th>Created</th></tr></thead>
            <tbody id="users-list"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="users.js" defer></script>
  </body>
</html>
