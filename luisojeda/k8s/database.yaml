apiVersion: v1
kind: Namespace
metadata:
  name: mynamespacek8s
---
apiVersion: v1
kind: Service
metadata:
  name: web-app-db
  namespace: mynamespacek8s
  labels:
    app: web-app-db
spec:
  type: ClusterIP
  selector:
    app: web-app-db
  ports:
    - name: db
      port: 5432
      targetPort: db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web-app-db
  namespace: mynamespacek8s
spec:
  selector:
    matchLabels:
      app: web-app-db
  serviceName: "web-app-db"
  replicas: 1 # by default is 1
  minReadySeconds: 10 # by default is 0
  template:
    metadata:
      labels:
        app: web-app-db # has to match .spec.selector.matchLabels
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: web-app-db-container
        image: docker-homework-db:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
          name: db
        volumeMounts:
        - name: www
          mountPath: /var/lib/postgresql/data
        env:
          - name: POSTGRES_DB
            valueFrom:
              secretKeyRef:
                name: postgresql-secret
                key: POSTGRES_DB
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: postgresql-secret
                key: POSTGRES_USER
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgresql-secret
                key: POSTGRES_PASSWORD
  volumeClaimTemplates:
  - metadata:
      name: www
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "standard"
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
  namespace: mynamespacek8s
type: Opaque
stringData:
  POSTGRES_DB: appdb
  POSTGRES_USER: appuser
