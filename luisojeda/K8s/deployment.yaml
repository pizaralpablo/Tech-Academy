apiVersion: v1
kind: Namespace
metadata:
  name: mynamespace
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app-homework
  namespace: mynamespace
  labels:
    app: web-app-homework
spec:
  replicas: 4
  selector:
    matchLabels:
      app: web-app-homework
  template:
    metadata:
      labels:
        app: web-app-homework
    spec:
      containers:
        - name: web-app-container
          image: docker-homework:latest
          imagePullPolicy: Never
          ports:
          - name: http
            containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi