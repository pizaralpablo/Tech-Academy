<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rafael Estrada | Tech Academy</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .card {
      width: 90%;
      max-width: 700px;
      padding: 60px 40px;
      text-align: center;
      background: #1e293b;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 1.2rem;
      font-weight: normal;
      color: #38bdf8;
      margin-bottom: 30px;
    }

    p {
      line-height: 1.7;
      color: #cbd5e1;
      margin-bottom: 30px;
    }

    .tech {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .tech span {
      padding: 8px 16px;
      background: #334155;
      border-radius: 20px;
      font-size: 0.9rem;
    }

    .status {
      margin-top: 35px;
      font-size: 0.9rem;
      color: #4ade80;
    }
  </style>
</head>

<body>

  <main class="card">

    <h1>Rafael Estrada</h1>

    <h2>Cloud • Security • Engineering</h2>

    <p>
      Tech Academy Docker Lab.<br>
      This website is running inside a Docker container
      and is served by Nginx.
    </p>

    <div class="tech">
      <span>Docker</span>
      <span>Linux</span>
      <span>Cloud</span>
      <span>Security</span>
    </div>

    <div class="status">
      ● Container running
    </div>

  </main>

</body>
</html>
