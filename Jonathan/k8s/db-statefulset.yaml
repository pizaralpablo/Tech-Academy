apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jonathan-db
spec:
  serviceName: jonathan-db-service
  replicas: 1
  selector:
    matchLabels:
      app: jonathan-db
  template:
    metadata:
      labels:
        app: jonathan-db
    spec:
      containers:
        - name: jonathan-db
          image: jonathan-db:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: jonathan-db-secret
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
      # Usa la PVC dinamica (storage/db-pvc-dynamic.yaml + db-storageclass.yaml).
      # La variante estatica (db-pv-static.yaml + db-pvc-static.yaml) tambien
      # esta disponible en este folder para revision, pero no se usa aqui.
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: jonathan-db-pvc-dynamic
