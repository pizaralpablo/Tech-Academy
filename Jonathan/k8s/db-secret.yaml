# Deployment de la web app (para poder conectarse).
apiVersion: v1
kind: Secret
metadata:
  name: jonathan-db-secret
type: Opaque
stringData:
  POSTGRES_DB: techacademy
  POSTGRES_USER: jonathan
  POSTGRES_PASSWORD: changeme123
