apiVersion: apps/v1
kind: Deployment
metadata:
  name: mi-web-deployment
  labels:
    app: mi-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mi-web
  template:
    metadata:
      labels:
        app: mi-web
    spec:
      containers:
      - name: mi-web-container
        image: mi-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi