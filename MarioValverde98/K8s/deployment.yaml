apiVersion: apps/v1
kind: Deployment
metadata:
  name: mario-app-deployment
spec: 
  replicas: 2 
  selector:
   matchLabels:
     app: mario-web
  template: 
    metadata: 
     labels: 
      app: mario-web
    spec: 
      containers: 
       - name: mario-web-container
         image: mario-web-db:v2
         imagePullPolicy: IfNotPresent
         ports:
           - containerPort: 80
         env:
           - name: DB_HOST
             value: mario-db-service
           - name: DB_NAME
             valueFrom:
               secretKeyRef:
                 name: mariodb-secret
                 key: mysql-database
           - name: DB_USER
             valueFrom:
               secretKeyRef:
                 name: mariodb-secret
                 key: mysql-app-username
           - name: DB_PASSWORD
             valueFrom:
               secretKeyRef:
                 name: mariodb-secret
                 key: mysql-app-password
         resources:
          requests: 
            cpu: 100m 
            memory: 128Mi 
          limits: 
            cpu: 500m
            memory: 256Mi 
            
        


